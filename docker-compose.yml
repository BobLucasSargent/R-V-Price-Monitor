version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rv_ipc
      POSTGRES_USER: rv_ipc
      POSTGRES_PASSWORD: rv_ipc_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rv_ipc"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rv_ipc:rv_ipc_dev@db:5432/rv_ipc
      DATABASE_URL_SYNC: postgresql+psycopg2://rv_ipc:rv_ipc_dev@db:5432/rv_ipc
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
